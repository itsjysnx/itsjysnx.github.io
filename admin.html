<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio Admin — Jayson Frias Vitalcio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0f0e;--bg2:#111411;--surface:#161a17;--surface2:#1c221e;
  --green-accent:#4a7c5f;--green-light:#7aad8f;--green-deep:#1a2e20;
  --burgundy:#6b2737;--burgundy-pale:#c4637a;
  --gold:#c9a84c;--gold-light:#e2c97e;
  --text:#e8ede9;--text-muted:#8fa494;--text-dim:#506358;
  --mono:'DM Mono',monospace;--sans:'Outfit',sans-serif;
  --red:#e05c5c;--green-ok:#4a9c6f;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;min-height:100vh}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-box{width:100%;max-width:400px;background:var(--surface);border:1px solid rgba(74,124,95,.2);padding:3rem}
.login-box h1{font-family:var(--mono);font-size:1rem;letter-spacing:.2em;color:var(--gold-light);margin-bottom:.5rem}
.login-box p{font-size:.85rem;color:var(--text-muted);margin-bottom:2rem}
.login-box input{width:100%;background:var(--bg);border:1px solid rgba(74,124,95,.2);color:var(--text);font-family:var(--sans);font-size:.95rem;padding:.9rem 1.1rem;outline:none;transition:border-color .3s;margin-bottom:1rem}
.login-box input:focus{border-color:var(--green-accent)}
.login-box button{width:100%;padding:1rem;background:none;border:1px solid var(--gold);color:var(--gold-light);font-family:var(--mono);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.login-box button:hover{background:var(--gold);color:var(--bg)}
.login-err{color:var(--red);font-size:.8rem;font-family:var(--mono);margin-top:.75rem;display:none}

/* ── MAIN APP ── */
#app{display:none}
header{background:var(--surface);border-bottom:1px solid rgba(74,124,95,.15);padding:1.25rem 2.5rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header-left h1{font-family:var(--mono);font-size:.85rem;letter-spacing:.2em;color:var(--gold-light)}
.header-left p{font-size:.75rem;color:var(--text-dim);margin-top:.2rem}
.header-right{display:flex;gap:1rem;align-items:center}
.btn{padding:.6rem 1.4rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;border:1px solid;transition:all .3s}
.btn-gold{border-color:var(--gold);color:var(--gold-light);background:none}.btn-gold:hover{background:var(--gold);color:var(--bg)}
.btn-green{border-color:rgba(74,124,95,.5);color:var(--green-light);background:none}.btn-green:hover{background:rgba(74,124,95,.15)}
.btn-red{border-color:rgba(224,92,92,.4);color:var(--red);background:none}.btn-red:hover{background:rgba(224,92,92,.1)}
.btn-sm{padding:.4rem .9rem;font-size:.62rem}
.badge-out{padding:.3rem .8rem;font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;color:var(--text-dim);border:1px solid rgba(74,124,95,.15);cursor:pointer;transition:all .3s}.badge-out:hover{color:var(--red);border-color:rgba(224,92,92,.3)}

main{padding:2.5rem;max-width:1400px;margin:0 auto}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2.5rem}
.stat-card{background:var(--surface);border:1px solid rgba(74,124,95,.12);padding:1.5rem}
.stat-card .num{font-family:var(--mono);font-size:2rem;color:var(--gold-light);margin-bottom:.25rem}
.stat-card .lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim)}

/* ── TOOLBAR ── */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:gap}
.toolbar-left{display:flex;gap:.75rem;flex-wrap:wrap}
.filter-btn{padding:.45rem 1rem;font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(74,124,95,.2);color:var(--text-dim);background:none;cursor:pointer;transition:all .3s}
.filter-btn.active,.filter-btn:hover{border-color:var(--green-accent);color:var(--green-light);background:rgba(74,124,95,.08)}
.search-input{background:var(--surface);border:1px solid rgba(74,124,95,.2);color:var(--text);font-family:var(--sans);font-size:.85rem;padding:.5rem 1rem;outline:none;width:220px;transition:border-color .3s}
.search-input:focus{border-color:var(--green-accent)}

/* ── PROJECT LIST ── */
.proj-list{display:flex;flex-direction:column;gap:.75rem}
.proj-row{background:var(--surface);border:1px solid rgba(74,124,95,.1);padding:1.25rem 1.5rem;display:grid;grid-template-columns:auto 1fr auto auto;gap:1.5rem;align-items:center;transition:border-color .3s}
.proj-row:hover{border-color:rgba(74,124,95,.3)}
.proj-row.featured-row{border-left:2px solid var(--gold)}
.proj-num{font-family:var(--mono);font-size:.65rem;color:var(--text-dim);width:2rem;text-align:center}
.proj-info h3{font-size:.95rem;font-weight:400;margin-bottom:.3rem;color:var(--text)}
.proj-info .meta{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.proj-info .cat{font-family:var(--mono);font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;padding:.2rem .55rem;border:1px solid}
.cat-dev{border-color:rgba(74,124,95,.4);color:var(--green-light)}
.cat-data{border-color:rgba(155,61,82,.4);color:var(--burgundy-pale)}
.cat-photo{border-color:rgba(201,168,76,.35);color:var(--gold-light)}
.proj-info .tags{font-size:.75rem;color:var(--text-dim)}
.proj-featured{display:flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.6rem;color:var(--gold);letter-spacing:.1em}
.proj-featured input{accent-color:var(--gold);width:14px;height:14px;cursor:pointer}
.proj-actions{display:flex;gap:.5rem}
.empty-state{text-align:center;padding:5rem 2rem;color:var(--text-dim);font-family:var(--mono);font-size:.8rem;letter-spacing:.15em;border:1px dashed rgba(74,124,95,.15);background:var(--surface)}
.empty-state .big{font-family:'Outfit';font-size:1.1rem;color:var(--text-muted);margin-bottom:.75rem;font-style:italic;letter-spacing:0}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;align-items:center;justify-content:center;padding:2rem}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid rgba(74,124,95,.2);width:100%;max-width:680px;max-height:90vh;overflow-y:auto}
.modal-header{padding:1.5rem 2rem;border-bottom:1px solid rgba(74,124,95,.12);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-header h2{font-family:var(--mono);font-size:.85rem;letter-spacing:.2em;color:var(--gold-light)}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:1.2rem;cursor:pointer;transition:color .3s;padding:.25rem .5rem}.modal-close:hover{color:var(--text)}
.modal-body{padding:2rem}
.form-group{display:flex;flex-direction:column;gap:.45rem;margin-bottom:1.25rem}
.form-group label{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim)}
.form-group input,.form-group textarea,.form-group select{background:var(--bg);border:1px solid rgba(74,124,95,.2);color:var(--text);font-family:var(--sans);font-size:.9rem;font-weight:300;padding:.8rem 1rem;outline:none;transition:border-color .3s;width:100%}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--green-accent)}
.form-group textarea{resize:vertical;min-height:90px}
.form-group select option{background:var(--surface)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-hint{font-size:.72rem;color:var(--text-dim);font-family:var(--mono)}
.form-check{display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--text-muted);cursor:pointer}
.form-check input{accent-color:var(--gold);width:15px;height:15px;cursor:pointer}
.modal-footer{padding:1.25rem 2rem;border-top:1px solid rgba(74,124,95,.12);display:flex;justify-content:flex-end;gap:.75rem;position:sticky;bottom:0;background:var(--surface)}

/* ── TOAST ── */
.toast{position:fixed;bottom:2rem;right:2rem;padding:.85rem 1.5rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;z-index:999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.ok{background:rgba(74,156,111,.15);border:1px solid rgba(74,156,111,.4);color:var(--green-light)}
.toast.err{background:rgba(224,92,92,.12);border:1px solid rgba(224,92,92,.35);color:var(--red)}

/* ── LOADING ── */
.loading{text-align:center;padding:3rem;font-family:var(--mono);font-size:.72rem;color:var(--text-dim);letter-spacing:.2em}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>PORTFOLIO ADMIN</h1>
    <p>Jayson Frias Vitalcio · Project Manager</p>
    <input type="password" id="pwInput" placeholder="Enter admin password" autocomplete="current-password"/>
    <button onclick="doLogin()">Access Dashboard →</button>
    <div class="login-err" id="loginErr">Incorrect password. Try again.</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <header>
    <div class="header-left">
      <h1>PORTFOLIO ADMIN</h1>
      <p>Manage your projects · Supabase connected</p>
    </div>
    <div class="header-right">
      <a href="index.html" target="_blank" class="btn btn-green btn-sm">View Site →</a>
      <button class="badge-out" onclick="doLogout()">Log out</button>
    </div>
  </header>

  <main>
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card"><div class="num" id="statTotal">—</div><div class="lbl">Total Projects</div></div>
      <div class="stat-card"><div class="num" id="statFeatured">—</div><div class="lbl">Featured (Home)</div></div>
      <div class="stat-card"><div class="num" id="statDev">—</div><div class="lbl">Development</div></div>
      <div class="stat-card"><div class="num" id="statData">—</div><div class="lbl">Data / Photo</div></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="filter-btn active" data-f="all">All</button>
        <button class="filter-btn" data-f="dev">Development</button>
        <button class="filter-btn" data-f="data">Data Analytics</button>
        <button class="filter-btn" data-f="photo">Photography</button>
        <input class="search-input" id="searchInput" placeholder="Search projects..." oninput="renderList()"/>
      </div>
      <button class="btn btn-gold" onclick="openModal()">+ Add Project</button>
    </div>

    <!-- List -->
    <div class="proj-list" id="projList">
      <div class="loading">LOADING PROJECTS...</div>
    </div>
  </main>
</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">ADD PROJECT</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId"/>
      <div class="form-row">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="fTitle" placeholder="Project name"/>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="fCategory">
            <option value="dev">Development</option>
            <option value="data">Data Analytics</option>
            <option value="photo">Photography</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="fDesc" placeholder="Short description of the project..."></textarea>
      </div>
      <div class="form-group">
        <label>Tags</label>
        <input type="text" id="fTags" placeholder="Python, SQL, React (comma separated)"/>
        <span class="form-hint">Separate tags with commas</span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Live URL</label>
          <input type="url" id="fLive" placeholder="https://..."/>
        </div>
        <div class="form-group">
          <label>GitHub URL</label>
          <input type="url" id="fGithub" placeholder="https://github.com/..."/>
        </div>
      </div>
      <div class="form-group">
        <label>Image URL (optional)</label>
        <input type="url" id="fImage" placeholder="https://... (link to project screenshot)"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Display Order</label>
          <input type="number" id="fOrder" placeholder="1" min="0"/>
        </div>
        <div class="form-group" style="justify-content:flex-end;padding-bottom:.2rem">
          <label style="margin-bottom:auto">&nbsp;</label>
          <label class="form-check">
            <input type="checkbox" id="fFeatured"/>
            Show on home page (featured)
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-green btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="saveProject()">Save Project →</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://gmsfewlslhnytdbcpsab.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zSVXmYalvCStZ7BbS37Wcg_hLCLUtGA';
const ADMIN_PASSWORD = 'jayson2026admin'; // Change this to your own password!

// ── STATE ────────────────────────────────────────────────────────────────────
let projects = [];
let activeFilter = 'all';

// ── LOGIN ────────────────────────────────────────────────────────────────────
function doLogin() {
  const pw = document.getElementById('pwInput').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadProjects();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
function doLogout() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pwInput').value = '';
}

// ── SUPABASE HELPERS ─────────────────────────────────────────────────────────
function headers(extra = {}) {
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation',
    ...extra
  };
}
async function sbGet() {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/projects?order=order_index.asc`, { headers: headers() });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbInsert(data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/projects`, {
    method: 'POST', headers: headers(), body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpdate(id, data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${id}`, {
    method: 'PATCH', headers: headers(), body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(id) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${id}`, {
    method: 'DELETE', headers: headers()
  });
  if (!r.ok) throw new Error(await r.text());
}

// ── LOAD ─────────────────────────────────────────────────────────────────────
async function loadProjects() {
  try {
    projects = await sbGet();
    renderStats();
    renderList();
  } catch (e) {
    showToast('Failed to load projects: ' + e.message, 'err');
  }
}

// ── STATS ────────────────────────────────────────────────────────────────────
function renderStats() {
  document.getElementById('statTotal').textContent = projects.length;
  document.getElementById('statFeatured').textContent = projects.filter(p => p.featured).length;
  document.getElementById('statDev').textContent = projects.filter(p => p.category === 'dev').length;
  document.getElementById('statData').textContent = projects.filter(p => p.category === 'data' || p.category === 'photo').length;
}

// ── LIST ─────────────────────────────────────────────────────────────────────
function catClass(c) { return c === 'data' ? 'cat-data' : c === 'photo' ? 'cat-photo' : 'cat-dev'; }
function catLabel(c) { return c === 'data' ? 'Data Analytics' : c === 'photo' ? 'Photography' : 'Development'; }

function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = projects.filter(p => {
    if (activeFilter !== 'all' && p.category !== activeFilter) return false;
    if (q && !p.title.toLowerCase().includes(q) && !(p.description||'').toLowerCase().includes(q)) return false;
    return true;
  });
  const el = document.getElementById('projList');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="big">No projects yet</div>Click "+ Add Project" to add your first one.</div>`;
    return;
  }
  el.innerHTML = list.map((p, i) => `
    <div class="proj-row ${p.featured ? 'featured-row' : ''}">
      <div class="proj-num">${String(p.order_index || i+1).padStart(2,'0')}</div>
      <div class="proj-info">
        <h3>${p.title}</h3>
        <div class="meta">
          <span class="cat ${catClass(p.category)}">${catLabel(p.category)}</span>
          <span class="tags">${(p.tags||[]).join(' · ')}</span>
          ${p.live_url ? `<a href="${p.live_url}" target="_blank" style="font-family:var(--mono);font-size:.6rem;color:var(--green-light);text-decoration:none">↗ Live</a>` : ''}
          ${p.github_url ? `<a href="${p.github_url}" target="_blank" style="font-family:var(--mono);font-size:.6rem;color:var(--text-dim);text-decoration:none">↗ GitHub</a>` : ''}
        </div>
      </div>
      <div class="proj-featured">
        <input type="checkbox" ${p.featured ? 'checked' : ''} onchange="toggleFeatured('${p.id}', this.checked)" title="Show on home page"/>
        Featured
      </div>
      <div class="proj-actions">
        <button class="btn btn-green btn-sm" onclick="openModal('${p.id}')">Edit</button>
        <button class="btn btn-red btn-sm" onclick="deleteProject('${p.id}', '${p.title.replace(/'/g,"\\'")}')">Delete</button>
      </div>
    </div>
  `).join('');
}

// ── FILTER BUTTONS ────────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.f;
    renderList();
  });
});

// ── MODAL ────────────────────────────────────────────────────────────────────
function openModal(id = null) {
  const p = id ? projects.find(x => x.id === id) : null;
  document.getElementById('modalTitle').textContent = p ? 'EDIT PROJECT' : 'ADD PROJECT';
  document.getElementById('editId').value = p ? p.id : '';
  document.getElementById('fTitle').value = p ? p.title : '';
  document.getElementById('fCategory').value = p ? (p.category || 'dev') : 'dev';
  document.getElementById('fDesc').value = p ? (p.description || '') : '';
  document.getElementById('fTags').value = p ? (p.tags || []).join(', ') : '';
  document.getElementById('fLive').value = p ? (p.live_url || '') : '';
  document.getElementById('fGithub').value = p ? (p.github_url || '') : '';
  document.getElementById('fImage').value = p ? (p.image_url || '') : '';
  document.getElementById('fOrder').value = p ? (p.order_index || '') : (projects.length + 1);
  document.getElementById('fFeatured').checked = p ? !!p.featured : false;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// ── SAVE ─────────────────────────────────────────────────────────────────────
async function saveProject() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { showToast('Title is required', 'err'); return; }

  const tagsRaw = document.getElementById('fTags').value;
  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

  const data = {
    title,
    category: document.getElementById('fCategory').value,
    description: document.getElementById('fDesc').value.trim() || null,
    tags,
    live_url: document.getElementById('fLive').value.trim() || null,
    github_url: document.getElementById('fGithub').value.trim() || null,
    image_url: document.getElementById('fImage').value.trim() || null,
    order_index: parseInt(document.getElementById('fOrder').value) || 0,
    featured: document.getElementById('fFeatured').checked,
  };

  const id = document.getElementById('editId').value;
  try {
    if (id) {
      await sbUpdate(id, data);
      showToast('Project updated!', 'ok');
    } else {
      await sbInsert(data);
      showToast('Project added!', 'ok');
    }
    closeModal();
    await loadProjects();
  } catch (e) {
    showToast('Error: ' + e.message, 'err');
  }
}

// ── TOGGLE FEATURED ───────────────────────────────────────────────────────────
async function toggleFeatured(id, val) {
  try {
    await sbUpdate(id, { featured: val });
    const p = projects.find(x => x.id === id);
    if (p) p.featured = val;
    renderStats();
    showToast(val ? 'Added to home page' : 'Removed from home page', 'ok');
  } catch(e) {
    showToast('Error: ' + e.message, 'err');
  }
}

// ── DELETE ────────────────────────────────────────────────────────────────────
async function deleteProject(id, title) {
  if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
  try {
    await sbDelete(id);
    showToast('Project deleted', 'ok');
    await loadProjects();
  } catch (e) {
    showToast('Error: ' + e.message, 'err');
  }
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
